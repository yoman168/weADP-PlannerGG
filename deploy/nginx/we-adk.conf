# nginx in front of we-adk, between its cloudflared and the Next.js server.
#
# This exists for one reason: Cloudflare percent-encodes ( ) and [ ] in
# Next.js chunk paths, and Next 15 returns 404 when both are encoded in the
# same URL. we-adk has a (workspace) route group under [projectId], so its
# sketcher edit and preview pages request
#
#   /_next/static/chunks/app/we-adk/projects/%5BprojectId%5D/sketcher/%28workspace%29/layout-….js
#
# which the app itself 404s. Without this proxy the pages die with
# "Application error: a client-side exception has occurred" and a
# ChunkLoadError. `$uri` is nginx's already-decoded path, so proxy_pass with
# $uri hands the app literal [projectId] and (workspace) and it serves them.
#
# Same trick as the shared Mac mini edge in we-testcase-ms/deploy/edge.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  # cloudflared terminates TLS and forwards plain HTTP, so keep the public
  # scheme it reports rather than nginx's own.
  map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  upstream app {
    server app:3000;
    keepalive 8;
  }

  # OhMyCMO, on the Mac host rather than this compose network. It has its own
  # nginx that owns the /ohmycmo prefix, so pass the path through untouched.
  upstream ohmycmo {
    server host.docker.internal:8889;
    keepalive 8;
  }

  server {
    listen 8080;
    server_name _;

    # Never advertise nginx's own port in a redirect.
    port_in_redirect off;
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 3600s;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 'ok\n';
    }

    location /ohmycmo/ {
      proxy_pass http://ohmycmo$uri$is_args$args;
    }

    location = /ohmycmo {
      proxy_pass http://ohmycmo$uri$is_args$args;
    }

    # Everything else is we-adk. It is the catch-all rather than a /we-adk/
    # prefix so BASE_PATH can stay empty: the app's own routes already begin
    # with /we-adk, and its /eacc, /api and /_next paths are all served here
    # without having to enumerate them.
    #
    # $uri, not $request_uri — the decoded form is the whole point.
    location / {
      proxy_pass http://app$uri$is_args$args;
    }
  }
}
