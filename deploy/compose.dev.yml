# What makes the dev stack a dev stack.
#
# Layered over compose.yml, and only where development genuinely differs: the source
# is mounted, the servers are the ones that reload, and the build stops at the `dev` target
# so nothing is compiled into the image.
#
#   pnpm stack:dev
#
# Everything else — the services, the wiring, the health checks — comes from the base file.

services:
  api:
    build:
      target: dev
    environment:
      # The claude-bridge service below, reached by its name on the stack's own network —
      # and, while set, the path for every AI call the API makes: a key someone pastes into
      # the workspace, or an ANTHROPIC_API_KEY here, goes through the bridge rather than
      # around it. Set it to an empty string to call Anthropic directly instead.
      CLAUDE_BRIDGE_URL: ${CLAUDE_BRIDGE_URL-http://claude-bridge:8788}
    depends_on:
      # Started, not healthy: the bridge is called on demand, and an API that refused to
      # come up because nobody had run `claude setup-token` would be a worse trade than
      # AI features that report they have no credential.
      claude-bridge:
        condition: service_started
    volumes:
      - ../backend:/app
      # Named, so the dependency cache survives a rebuild. Without it every start
      # re-downloads Spring. It must match GRADLE_USER_HOME in the Dockerfile's dev stage,
      # which is where the build stage's warmed cache was copied to.
      - gradle:/home/gradle-cache
      # Anonymous, masking the host's build output. The host tree is built by macOS Gradle
      # and mounting it in would have the container reuse those classes and its own
      # file locks.
      - /app/build
      - /app/.gradle
    working_dir: /app

  web:
    build:
      target: dev
    volumes:
      - ..:/app
      # Two anonymous volumes masking the mounted host directories.
      #
      # `node_modules` is the important one: the host's copy was built for macOS and its
      # native modules do not run on Alpine — the container has its own, installed during
      # the image build, and this is what stops the mount from hiding it.
      - /app/node_modules
      - /app/.next
    environment:
      # Read at runtime by `next dev`, so no rebuild is needed to point it somewhere else.
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-we-adk-workspace}
      # A bind mount from macOS does not deliver inotify events into the container, so the
      # watcher polls instead. Without this, saving a file changes nothing on screen.
      WATCHPACK_POLLING: 'true'
    # Turbopack rather than webpack. The sketcher page is some 5,900 modules, and webpack took
    # 45 to 60 seconds to compile it inside the VM while climbing to its 2 GB heap limit — and
    # once, having got there, it wedged: every later request for that route hung with the
    # process idle until the container was restarted. Turbopack compiles the same page in a
    # fraction of the time and memory, which is what keeps the dev server under the ceiling.
    command: ['pnpm', 'dev', '--hostname', '0.0.0.0', '--turbopack']

  # Claude, for a machine with no API key.
  #
  # Answers the Anthropic Messages API by running `claude --print` — see
  # scripts/claude-bridge.mjs. Development only: a deployment has ANTHROPIC_API_KEY and
  # never reaches for this.
  #
  # No published port. It is an unauthenticated Messages API, and the only thing that
  # needs to reach it is the api container, one network away.
  claude-bridge:
    container_name: ${STACK_NAME:-weadk}-claude-bridge
    build:
      context: ..
      dockerfile: deploy/bridge.Dockerfile
    environment:
      # From `claude setup-token`, kept in the git-ignored deploy/dev.secrets.env. The
      # container has no Keychain to borrow a login from, so this is how it signs in.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    restart: unless-stopped

  # The workspace and the API, on the internet, through Cloudflare quick tunnels.
  #
  #   pnpm stack:dev:tunnel
  #
  # Behind a profile because a tunnel is a deliberate act: `pnpm stack:dev` alone must not
  # put this machine's stack on a public hostname. scripts/tunnel.sh starts them, reads
  # the hostname each one prints, and writes both into deploy/dev.local.env — the API has
  # to know them, being the OAuth2 issuer and a CORS origin.
  #
  # Not restarted when they die. A new cloudflared process means a new hostname, and one
  # swapped in under a running stack breaks sign-in with no sign of why; a stopped tunnel
  # says so plainly. `pnpm stack:dev:tunnel` again, for new URLs.
  tunnel-web:
    container_name: ${STACK_NAME:-weadk}-tunnel-web
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --url http://web:3000 --protocol http2 --no-autoupdate
    restart: 'no'

  tunnel-api:
    container_name: ${STACK_NAME:-weadk}-tunnel-api
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --url http://api:8080 --protocol http2 --no-autoupdate
    restart: 'no'

volumes:
  gradle:
