# Versions outside Spring Boot's BOM. Everything else takes its version from the Boot
# plugin's dependency management, so these are the only two to keep an eye on.

# The Claude SDK. 2.61.0 is the version whose API this code is written against:
# AnthropicOkHttpClient, MessageCreateParams, ThinkingConfigAdaptive, OutputConfig.Effort
# and StreamResponse<RawMessageStreamEvent>.
anthropicVersion=2.61.0

# springdoc generates /v3/api-docs, which the TypeScript client is generated from. Bumping
# it can change the emitted schema, and CI fails on any drift in the committed openapi.json
# — so a bump here means regenerating, not just building.
springdocVersion=2.8.17

# Build performance. The daemon and caching are per-machine conveniences; CI passes
# --no-daemon and is unaffected by the first line.
org.gradle.caching=true
org.gradle.parallel=true

# Tests start a Postgres container and several Spring contexts. The default heap is enough
# for the build itself, but not for Gradle to hold a Spring context per test class.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
