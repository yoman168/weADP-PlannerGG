allowBuilds:
  sharp: set this to true or false
# Single-package repo. pnpm 11 reads its settings from here.
#
# sharp is Next's optional image optimiser and its install script is skipped;
# saying so explicitly keeps `pnpm <script>` from stopping on an unapproved build.
ignoredBuiltDependencies:
  - sharp
verifyDepsBeforeRun: false
