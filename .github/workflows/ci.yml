name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — build, test, and export the contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers needs a Docker daemon; ubuntu-latest has one.
      - name: Test
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress verify

      # The contract is exported from the running service, because springdoc builds it from
      # the Spring context rather than from source. Postgres is required for that context to
      # start at all: Flyway owns the schema and Hibernate validates against it.
      - name: Start Postgres
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_DB=weadk -e POSTGRES_USER=weadk -e POSTGRES_PASSWORD=weadk \
            -p 5432:5432 postgres:17-alpine
          for _ in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U weadk -d weadk && break
            sleep 2
          done

      - name: Export openapi.json
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/weadk
          DB_USER: weadk
          DB_PASSWORD: weadk
          PORT: '8080'
        run: |
          ./mvnw -B -q -DskipTests spring-boot:run &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8080/v3/api-docs -o /tmp/api-docs.json
          node ../scripts/openapi/normalize.mjs /tmp/api-docs.json > ../openapi/openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi/openapi.json

  web:
    name: Web — types match the API, then typecheck
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The contract as the API actually serves it, not as it was last committed.
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: openapi

      # This is the check that earns this job.
      #
      # The Java DTOs and the TypeScript client can disagree without anything failing to
      # compile on either side — the frontend is typed against a file that was generated
      # from an older version of the API, and the mismatch surfaces at runtime as a field
      # that is quietly undefined. So the document is re-exported from the running service
      # above, the types are regenerated from it here, and a diff against what is committed
      # fails the build. Regenerate locally with `pnpm api:export && pnpm api:types`.
      - name: openapi.json and schema.d.ts are current
        run: |
          pnpm api:types
          if ! git diff --exit-code -- openapi/openapi.json src/lib/api/schema.d.ts; then
            echo "::error::The API contract has moved. Run 'pnpm api:export && pnpm api:types' and commit the result."
            exit 1
          fi

      - run: pnpm typecheck
